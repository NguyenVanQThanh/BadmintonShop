# ==============================================================================
# 1. SERVER CONFIGURATION (SSL/HTTPS ENABLED)
# ==============================================================================
# Application Port.
# Default to 8443 for HTTPS. Can be overridden by SERVER_PORT env var.
server.port=${SERVER_PORT:8443}

# SSL / HTTPS Configuration.
# In Production, SSL is often handled by a Reverse Proxy (Nginx/AWS LB).
# This configuration is for standalone HTTPS or Local Development.
server.ssl.enabled=true
server.ssl.key-store=classpath:badminton-keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=badmintons

# SSL KeyStore Password.
# Uses env var 'SSL_KEY_PASSWORD'.
server.ssl.key-store-password=${SSL_KEY_PASSWORD}

# Encoding settings to support multi-language content (UTF-8).
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

# ==============================================================================
# 2. DATASOURCE CONFIGURATION (PostgreSQL)
# ==============================================================================
# Database connection settings.
# Ensure these environment variables are set in your OS or Run Configuration.
spring.datasource.url=${DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# 3. JPA / HIBERNATE CONFIGURATION
# ==============================================================================
# DDL Generation Strategy.
# - 'update': Useful for DEV to auto-update schema.
# - 'validate': Recommended for PRODUCTION to prevent accidental schema changes.
spring.jpa.hibernate.ddl-auto=update

# SQL Logging.
# Set to 'false' in PRODUCTION to improve performance and reduce log noise.
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
# 4. PERFORMANCE & TRANSACTION MANAGEMENT
# ==============================================================================
# Disable Open-Session-In-View (OSIV).
# Prevents connection pool exhaustion and N+1 query issues in the View layer.
spring.jpa.open-in-view=false

# JDBC Batch Processing for bulk inserts/updates.
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==============================================================================
# 5. LOGGING CONFIGURATION
# ==============================================================================
# Root logger level.
logging.level.root=INFO

# SQL Parameter Binding Logging.
# WARNING: Set to 'TRACE' only for debugging. 
# Keep 'INFO' in PRODUCTION to avoid leaking sensitive data in logs.
logging.level.org.hibernate.orm.jdbc.bind=INFO

# ==============================================================================
# 6. SECURITY & JWT CONFIGURATION
# ==============================================================================
# JWT Secret Key & Expiration.
# Must be supplied via environment variables for security.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}